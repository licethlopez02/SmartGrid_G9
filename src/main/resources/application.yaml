server:
  port: 8080
spring:
  application:
    name: smart_grid
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_grid
    username: smart_grid_user
    password: smart_grid_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect