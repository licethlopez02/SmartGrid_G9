server:
  port: 8000
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: medicion-route
              uri: lb://medicion-service
              predicates:
                - Path=/api/medidores/**,/api/anomalias/**
            - id: facturacion-route
              uri: lb://facturacion-service
              predicates:
                - Path=/api/facturas/**,/api/tarifas/**
            - id: usuarios-route
              uri: lb://usuarios-service
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka