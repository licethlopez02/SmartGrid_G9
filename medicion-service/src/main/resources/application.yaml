server:
  port: 8080
spring:
  application:
    name: medicion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/medicion
    username: medicion_user
    password: medicion_pass
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
      skip:
        in-tests: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  grpc:
    server:
      port: 9090
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: medicion-service
      auto-offset-reset: earliest
jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-smart-grid-g9-minimo-32-bytes}
usuarios:
  grpc:
    host: ${USUARIOS_GRPC_HOST:localhost}
    port: ${USUARIOS_GRPC_PORT:9091}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka