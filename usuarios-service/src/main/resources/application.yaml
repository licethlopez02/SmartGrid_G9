server:
  port: 8083
spring:
  application:
    name: usuarios-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/usuarios?sslmode=disable
    username: usuarios_user
    password: ${USUARIOS_DB_PASSWORD:usuarios_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  docker:
    compose:
      skip:
        in-tests: false
  grpc:
    server:
      port: 9091
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: usuarios-service
      auto-offset-reset: latest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:smartgrid.g9.alertas@gmail.com}
    password: ${MAIL_PASSWORD: } # aqui se coloca la contraseña de la cuenta de correo para enviar alertas
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-smart-grid-g9-minimo-32-bytes}
  expiracion-minutos: 60
operador-inicial:
  correo: ${OPERADOR_CORREO:operador@smartgrid.local}
  contrasena: ${OPERADOR_CONTRASENA:Operador123!}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka