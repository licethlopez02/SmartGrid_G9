server:
  port: 8081
spring:
  application:
    name: facturacion-service
  datasource:
    url: jdbc:postgresql://localhost:5433/facturacion
    username: facturacion_user
    password: facturacion_pass
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      skip:
        in-tests: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  grpc:
    client:
      channel:
        medicion:
          target: static://localhost:9090
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: facturacion-service
      auto-offset-reset: earliest
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka