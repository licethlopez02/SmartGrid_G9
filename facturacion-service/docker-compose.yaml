services:
  facturacion-db:
    image: postgres:16
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion_user
      POSTGRES_PASSWORD: facturacion_pass
    ports:
    
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion_user -d facturacion"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s